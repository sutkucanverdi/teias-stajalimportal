server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: teias-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teias_portal_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Istanbul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Europe/Istanbul

app:
  jwt:
    # Üretimde mutlaka JWT_SECRET ortam değişkeni ile değiştirin (en az 32 karakter)
    secret: ${JWT_SECRET:teias-staj-portali-gelistirme-icin-gizli-anahtar-2026-degistirin}
    gecerlilik-dakika: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    izinli-adresler: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  dosya:
    dizin: ${UPLOAD_DIR:./uploads}
  kayit:
    # true yapılırsa öğrenci kaydı aktivasyon kodu ile doğrulanmadan giriş yapamaz
    aktivasyon-gerekli: ${KAYIT_AKTIVASYON_GEREKLI:false}
  seed:
    ik-kullanici-adi: ${IK_ADMIN_KULLANICI_ADI:ik_admin}
    ik-sifre: ${IK_ADMIN_SIFRE:teias2026}
    demo-veri: ${DEMO_VERI:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.example.teiasbackend: INFO
