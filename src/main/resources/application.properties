# 1. VERİTABANI BAĞLANTI AYARLARI (Kiler Köprüsü)
spring.datasource.url=jdbc:postgresql://localhost:5432/teias_portal_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# 2. TABLO OTOMASYON AYARLARI (Sihirli Kısım)
# Java'da yazacağımız sınıflara bakıp veritabanındaki tabloları otomatik oluşturur/günceller:
spring.jpa.hibernate.ddl-auto=update

# Arka planda çalıştırılan SQL sorgularını terminalde görmemizi sağlar:
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true